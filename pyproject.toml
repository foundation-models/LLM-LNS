[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-lns"
version = "0.1.0"
description = "Large Language Model for Large Neighborhood Search"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "gurobipy==12.0.2",
    "joblib==1.4.2",
    "networkx==3.4.2",
    "numba==0.61.2",
    "numpy==2.3.0",
    "requests==2.32.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
